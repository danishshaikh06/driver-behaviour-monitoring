[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "driver-behaviour-monitor"
version = "0.1.0"
description = "Webcam-based driver behaviour monitoring"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Danish Shaikh" }]
dependencies = [
  "mediapipe>=0.10.8",
  "numpy>=1.24",
  "opencv-python>=4.8",
  "pygame>=2.5",
  "pyttsx3>=2.90",
  "torch>=2.0",
  "ultralytics>=8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
driver-monitor = "driver_monitor.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
